# Tests on Linux, the Docker image, and a smoke test of the image. A v* tag publishes the image to ghcr.io.
# Never calls EFA-BW: tests use recorded fixtures, and the smoke test runs with the upstream switched off.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/42778312/konstanzgo-live

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
      - name: Shared API
        run: swift test --package-path KGLiveAPI
      - name: Server
        run: swift test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: LIVE_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
          load: true
          tags: konstanzgo-live:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (upstream off, no request leaves the runner)
        run: |
          docker run -d --name live -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp \
            -e LIVE_UPSTREAM_ENABLED=false konstanzgo-live:test
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/v1/health | grep -q '"upstream":"off"'
          curl -sf --compressed http://127.0.0.1:8080/v1/live/snapshot | grep -q '"v":1'
          curl -sf "http://127.0.0.1:8080/v1/stops/de:08335:11918/departures?limit=3" | grep -q '"stop":"de:08335:11918"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'CF-Ray: x' http://127.0.0.1:8080/metrics)" = 404
          for i in $(seq 1 40); do
            test "$(docker inspect -f '{{.State.Health.Status}}' live)" = healthy && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' live | grep -q healthy
          docker image ls konstanzgo-live:test --format 'size {{.Size}}'
      - name: Server logs
        if: always()
        run: docker logs live || true
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish on a v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag konstanzgo-live:test "$IMAGE:${GITHUB_REF_NAME}"
          docker tag konstanzgo-live:test "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:latest"
