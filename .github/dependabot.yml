# Weekly update PRs. Vapor and friends are pinned in Package.resolved; review each bump before merging.
version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
